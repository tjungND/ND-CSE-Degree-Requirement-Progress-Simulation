<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Light and dark since 2026-10-04 (night mode; data-theme on <html>). -->
    <meta name="color-scheme" content="light dark" />
    <!-- No icon file: without this line every browser asks the server for
         /favicon.ico, gets a 404 and Chrome logs it as a console error
         (cross-browser review, 2026-10-10). -->
    <link rel="icon" href="data:," />
    <!-- Night mode before the first paint (DGS 2026-10-04; src/ui/theme.ts has the
         rest and must agree): a saved Light/Dark wins; otherwise the device's
         setting, except embedded (?embed=1), where Auto stays light; and dark
         wherever the browser forces pages dark. -->
    <script>
      try {
        var p = localStorage.getItem('cse-degree-audit/v1/theme');
        var e = new URLSearchParams(location.search).get('embed') === '1' || location.hash === '#embed';
        // A browser forcing pages dark (Opera's "Force dark pages") turns a
        // light-scheme link rgb(158, 158, 255): Auto is then the page's own dark
        // theme, in the frame too (src/ui/theme.ts browserForcesDark).
        var f = false;
        try {
          if (!matchMedia('(forced-colors: active)').matches) {
            var a = document.createElement('a');
            a.href = '#';
            a.style.cssText = 'position:absolute;left:-9999px;color-scheme:light';
            document.documentElement.appendChild(a);
            f = getComputedStyle(a).color === 'rgb(158, 158, 255)';
            a.remove();
          }
        } catch (y) {}
        var d = p === 'dark' || (p !== 'light' && (f || (!e && matchMedia('(prefers-color-scheme: dark)').matches)));
        document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
      } catch (x) {}
    </script>
    <title>ND CSE Degree Requirement Progress Simulation</title>
    <meta
      name="description"
      content="Self-check for Notre Dame CSE graduate students against the CSE Graduate Studies Handbook — MSCSE (§3) and Ph.D. (§4) requirements. Not an official audit."
    />
  </head>
  <body>
    <div id="app">
      <!-- Without JavaScript this file is an empty box (review R-25, 2026-09-18);
           the renderer clears #app before it draws, so this costs nothing. -->
      <noscript>
        <h1>ND CSE Degree Requirement Progress Simulation</h1>
        <p>
          <strong>This tool needs JavaScript.</strong> Everything it does — reading your transcript, checking it against the requirements — happens in
          your own browser, so with scripts turned off there is nothing to run. Nothing you enter is ever uploaded.
        </p>
        <p>
          Turn JavaScript on for this site and reload. Questions: email the Director of Graduate Studies (currently
          <a href="mailto:tjung@nd.edu">tjung@nd.edu</a>).
          <!-- The role first, the address second (blue-team review 2026-10-17, U32): HTML cannot read the sheet's
               contact_* rows, so this line and its twin in courses.html are on the handoff list (src/ui/contacts.ts). -->
        </p>
        <p>
          The requirements themselves are in the
          <a href="https://drive.google.com/open?id=1SpxGErmfwWvU4dTEkAy_3LJvzm_DUxA_&amp;usp=drive_fs">CSE Graduate Studies Handbook</a>.
        </p>
      </noscript>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
