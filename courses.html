<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Light and dark since 2026-10-04 (night mode; data-theme on <html>). -->
    <meta name="color-scheme" content="light dark" />
    <!-- No icon file: without this line every browser asks the server for
         /favicon.ico, gets a 404 and Chrome logs it as a console error
         (cross-browser review, 2026-10-10). -->
    <link rel="icon" href="data:," />
    <!-- The rules start downloading here, while the app's script does (2026-10-26):
         the build replaces the next line with a few lines written from
         data/sheet-urls.json (vite.config.ts rulesHeadStart, src/data/head-start.ts).
         Keep it above every stylesheet — a script after one waits for it. -->
    <!-- rules-head-start -->
    <!-- Night mode before the first paint (DGS 2026-10-04; src/ui/theme.ts has the
         rest and must agree): a saved Light/Dark wins; otherwise the device's
         setting — embedded (?embed=1) too since 2026-10-25, where the page is
         marked `embed` here so its first paint already has the frame's
         palette; and dark wherever the browser forces pages dark. -->
    <script>
      try {
        var e = new URLSearchParams(location.search).get('embed') === '1' || location.hash === '#embed';
        if (e) document.documentElement.classList.add('embed');
        // Storage can be refused (all cookies blocked): the device decides then.
        var p = null;
        try {
          p = localStorage.getItem('cse-degree-audit/v1/theme');
        } catch (z) {}
        // A browser forcing pages dark (Opera's "Force dark pages") turns a
        // light-scheme link rgb(158, 158, 255): Auto is then the page's own dark
        // theme, in the frame too (src/ui/theme.ts browserForcesDark).
        var f = false;
        try {
          if (!matchMedia('(forced-colors: active)').matches) {
            var a = document.createElement('a');
            a.href = '#';
            a.style.cssText = 'position:absolute;left:-9999px;color-scheme:light';
            document.documentElement.appendChild(a);
            f = getComputedStyle(a).color === 'rgb(158, 158, 255)';
            a.remove();
          }
        } catch (y) {}
        var d = p === 'dark' || (p !== 'light' && (f || matchMedia('(prefers-color-scheme: dark)').matches));
        document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
      } catch (x) {}
    </script>
    <title>CSE Graduate Course Rules — which courses count</title>
    <meta
      name="description"
      content="Which Notre Dame CSE graduate courses count toward the MSCSE and Ph.D. degrees, which core-knowledge area and specialization category each satisfies, and when they are typically offered. Generated live from the DGS's rules sheet."
    />
  </head>
  <body>
    <div id="app">
      <!-- The whole page is built in the browser, so without JavaScript this
           file is an empty box: no heading, no contact, nothing to say why
           (review R-25, 2026-09-18). The renderer clears #app before it draws,
           so this costs the working page nothing. Plain HTML on purpose — it
           has to read correctly with no stylesheet either. -->
      <noscript>
        <h1>CSE Graduate Course Rules</h1>
        <p>
          <strong>This page needs JavaScript.</strong> The course list is built in your own browser from the Director of Graduate Studies' rules
          spreadsheet — nothing about you is sent anywhere — so with scripts turned off there is nothing to show.
        </p>
        <p>
          Turn JavaScript on for this site and reload, or ask for the current course rules directly: email the Director of
          Graduate Studies (currently <a href="mailto:tjung@nd.edu">tjung@nd.edu</a>).
          <!-- The role first, the address second (blue-team review 2026-10-17, U32): HTML cannot read the sheet's
               contact_* rows, so this line and its twin in index.html are on the handoff list (src/ui/contacts.ts). -->
        </p>
        <p>
          The requirements themselves are in the
          <a href="https://drive.google.com/open?id=1SpxGErmfwWvU4dTEkAy_3LJvzm_DUxA_&amp;usp=drive_fs">CSE Graduate Studies Handbook</a>.
        </p>
      </noscript>
    </div>
    <script type="module" src="./src/courses.ts"></script>
  </body>
</html>
